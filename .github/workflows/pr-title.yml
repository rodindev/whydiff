name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Title is a conventional commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert'
          scopes='core|capture|playwright|cli|report|docs|deps|ci|release|config'
          pattern="^($types)(\(($scopes)\))?!?: [a-z0-9].*[^.]$"
          fail() {
            echo "::error title=PR title::$1"
            echo "Got: $TITLE"
            exit 1
          }
          [[ "$TITLE" =~ $pattern ]] || fail "use type(scope): lowercase subject without a final period; types: $types; scopes: $scopes"
          (( ${#TITLE} <= 72 )) || fail "keep it at 72 characters or fewer"
          ! LC_ALL=C grep -q '[^ -~]' <<< "$TITLE" || fail "ASCII only: no em-dash, smart quotes or emoji"
          echo "ok: $TITLE"
