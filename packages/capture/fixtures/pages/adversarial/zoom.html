<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CSS zoom</title>
    <style>
      body { margin: 0; background: #fff; }
      .at { position: absolute; }
    </style>
  </head>
  <body>
    <!-- zoom 2: a 20px square with margin-left 10 paints as 40px at 100+20 -->
    <div class="at" style="left: 100px; top: 100px">
      <div style="zoom: 2">
        <div id="z-two" style="width: 20px; height: 20px; margin-left: 10px; background: #ff0000" data-color="ff0000" data-expect="120,100,40,40"></div>
      </div>
    </div>
    <!-- zoom 0.5 inside zoom 2 is zoom 1 again -->
    <div class="at" style="left: 300px; top: 100px">
      <div style="zoom: 2">
        <div style="zoom: 0.5">
          <div id="z-one" style="width: 40px; height: 40px; margin-left: 20px; background: #00ff00" data-color="00ff00" data-expect="320,100,40,40"></div>
        </div>
      </div>
    </div>
    <!-- zoom 2 on a scroller: 100x100 paints as 200x200, its 300px content as 600px; scrollTop 50 moves the content by 100 px -->
    <div class="at" style="left: 100px; top: 300px">
      <div id="z-scroller" style="zoom: 2; width: 100px; height: 100px; overflow: auto; background: #eeeeee" data-expect-scroll="0,100,200,600">
        <div style="position: relative; height: 300px">
          <div id="z-in" style="position: absolute; left: 10px; top: 80px; width: 20px; height: 20px; background: #0000ff" data-color="0000ff" data-expect="120,360,40,40"></div>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('z-scroller').scrollTop = 50
    </script>
  </body>
</html>
