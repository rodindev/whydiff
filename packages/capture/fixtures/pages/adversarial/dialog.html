<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dialog in the top layer</title>
    <style>
      body { margin: 0; background: #fff; }
      dialog { margin: 0; padding: 0; border: 0; outline: none; width: 40px; height: 40px; }
      dialog::backdrop { background: transparent; }
      .trap { position: absolute; width: 60px; height: 60px; overflow: hidden; background: #eeeeee; }
    </style>
  </head>
  <body>
    <!-- a modal dialog is rendered in the top layer: the ancestor's overflow, transform and opacity do not apply -->
    <div class="trap" style="left: 50px; top: 50px; transform: translate(10px, 10px); opacity: 0">
      <dialog id="modal" style="position: fixed; left: 400px; top: 200px; background: #ff0000" data-color="ff0000" data-expect="400,200,40,40"></dialog>
    </div>
    <!-- control: a non-modal open dialog stays in the flow of its clipping parent -->
    <div class="trap" style="left: 50px; top: 300px">
      <dialog id="inline" open style="position: absolute; left: 200px; top: 0; background: #00ff00" data-color="00ff00" data-expect-flag="clipped"></dialog>
    </div>
    <!-- control: a closed dialog is not rendered -->
    <dialog id="closed" style="background: #0000ff" data-color="0000ff" data-expect-flag="hidden"></dialog>
    <script>
      document.getElementById('modal').showModal()
    </script>
  </body>
</html>
