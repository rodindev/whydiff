<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Settings</title>
    <link rel="stylesheet" href="ui-kit.css">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <header class="app-bar">
      <span class="app-title">Settings</span>
      <button class="ui-button ui-secondary">Help</button>
    </header>
    <main class="app-main">
      <label class="app-field">Name <input class="ui-input" value="Sample user"></label>
      <label class="app-field">Language <input class="ui-input" value="English"></label>
      <div class="app-actions">
        <button class="ui-button">Save</button>
        <button class="ui-button ui-secondary">Cancel</button>
      </div>
    </main>
  </body>
</html>
