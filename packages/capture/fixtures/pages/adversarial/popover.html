<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Popover in the top layer</title>
    <style>
      body { margin: 0; background: #fff; }
      [popover] { margin: 0; padding: 0; border: 0; inset: auto; width: 40px; height: 40px; }
      .trap { position: absolute; width: 60px; height: 60px; overflow: hidden; background: #eeeeee; }
    </style>
  </head>
  <body>
    <!-- an open popover is rendered in the top layer: the ancestor's overflow does not clip it -->
    <div class="trap" style="left: 50px; top: 50px">
      <div id="pop-clip" popover style="left: 600px; top: 200px; background: #ff0000" data-color="ff0000" data-expect="600,200,40,40"></div>
    </div>
    <!-- nor does the ancestor's opacity -->
    <div class="trap" style="left: 50px; top: 200px; opacity: 0">
      <div id="pop-fade" popover="manual" style="left: 700px; top: 200px; background: #00ff00" data-color="00ff00" data-expect="700,200,40,40"></div>
    </div>
    <!-- control: a popover that is not shown is not rendered -->
    <div id="pop-closed" popover style="left: 800px; top: 200px; background: #0000ff" data-color="0000ff" data-expect-flag="hidden"></div>
    <script>
      document.getElementById('pop-clip').showPopover()
      document.getElementById('pop-fade').showPopover()
    </script>
  </body>
</html>
