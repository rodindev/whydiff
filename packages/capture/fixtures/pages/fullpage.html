<!DOCTYPE html>
<html>
  <head>
    <style>
      body { margin: 0; background: #fff; width: 1280px; height: 3000px; position: relative; }
      #header { position: fixed; left: 300px; top: 0; width: 600px; height: 60px; background: #ff0000; }
      #column { position: absolute; left: 0; top: 200px; width: 200px; height: 2600px; background: #eeeeee; }
      #sticky { position: sticky; top: 100px; width: 200px; height: 80px; background: #0000ff; }
      #marker { position: absolute; left: 600px; top: 1500px; width: 50px; height: 50px; background: #00aa00; }
    </style>
  </head>
  <body>
    <div id="header"></div>
    <div id="column"><div id="sticky"></div></div>
    <div id="marker"></div>
  </body>
</html>
