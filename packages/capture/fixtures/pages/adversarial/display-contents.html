<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>display: contents</title>
    <style>
      body { margin: 0; background: #fff; }
      .m { width: 40px; height: 40px; }
      .contents { display: contents; }
    </style>
  </head>
  <body>
    <!-- the wrapper's children become flex items of the outer row: 100, 160, 220 with a 20px gap -->
    <div style="position: absolute; left: 100px; top: 100px; display: flex; gap: 20px">
      <div class="contents">
        <div id="dc-1" class="m" style="background: #ff0000" data-color="ff0000" data-expect="100,100,40,40"></div>
        <div id="dc-2" class="m" style="background: #00ff00" data-color="00ff00" data-expect="160,100,40,40"></div>
      </div>
      <div id="dc-3" class="m" style="background: #0000ff" data-color="0000ff" data-expect="220,100,40,40"></div>
    </div>
    <!-- overflow, size and opacity do not apply to a box that is not generated -->
    <div class="contents" style="overflow: hidden; width: 10px; height: 10px; opacity: 0">
      <div id="dc-unclipped" class="m" style="position: absolute; left: 400px; top: 100px; background: #ff00ff" data-color="ff00ff" data-expect="400,100,40,40"></div>
    </div>
    <!-- visibility is inherited through it -->
    <div class="contents" style="visibility: hidden">
      <div id="dc-invisible" class="m" style="position: absolute; left: 500px; top: 100px; background: #ffff00" data-color="ffff00" data-expect-flag="hidden"></div>
    </div>
    <!-- a grid whose items sit inside two levels of display: contents -->
    <div style="position: absolute; left: 100px; top: 300px; display: grid; grid-template-columns: 40px 40px; column-gap: 10px">
      <div class="contents"><div class="contents"><div id="dc-grid" class="m" style="grid-column: 2; background: #00ffff" data-color="00ffff" data-expect="150,300,40,40"></div></div></div>
    </div>
  </body>
</html>
