<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>object-fit and object-position</title>
    <style>
      body { margin: 0; background: #fff; }
      img { position: absolute; display: block; width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <!-- a 2:1 image covering a square box -->
    <img id="of-cover" alt="" style="left: 100px; top: 100px; object-fit: cover" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2740%27%3E%3Crect width=%2780%27 height=%2740%27 fill=%27%23ff0000%27/%3E%3C/svg%3E" data-color="ff0000" data-expect="100,100,40,40" />
    <!-- a 10px image stretched to 40px -->
    <img id="of-fill" alt="" style="left: 200px; top: 100px; object-fit: fill" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%2710%27%3E%3Crect width=%2710%27 height=%2710%27 fill=%27%2300ff00%27/%3E%3C/svg%3E" data-color="00ff00" data-expect="200,100,40,40" />
    <!-- object-fit: none on an 80px image, positioned so the box shows one 40px quarter -->
    <img id="of-none" alt="" style="left: 300px; top: 100px; object-fit: none; object-position: -40px -40px" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2780%27%3E%3Crect width=%2780%27 height=%2780%27 fill=%27%23888888%27/%3E%3Crect x=%2740%27 y=%2740%27 width=%2740%27 height=%2740%27 fill=%27%230000ff%27/%3E%3C/svg%3E" data-color="0000ff" data-expect="300,100,40,40" />
    <!-- aspect-ratio overrides the natural ratio of a 2:1 image -->
    <img id="of-ratio" alt="" style="left: 400px; top: 100px; height: auto; aspect-ratio: 1 / 1" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2740%27 preserveAspectRatio=%27none%27%3E%3Crect width=%2780%27 height=%2740%27 fill=%27%23ff00ff%27/%3E%3C/svg%3E" data-color="ff00ff" data-expect="400,100,40,40" />
  </body>
</html>
