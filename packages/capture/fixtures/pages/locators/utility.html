<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Utility classes</title>
    <style>
      body { margin: 0; background: #fff; font: 14px sans-serif; }
      .flex { display: flex; }
      .p-4 { padding: 16px; }
      .w-1\/2 { width: 50%; }
      .h-6 { height: 24px; }
      .\32xl\:px-8 { padding-left: 32px; }
      .-mt-1 { margin-top: -4px; }
      .bg-\[\#f0f0f0\] { background: #f0f0f0; }
    </style>
  </head>
  <body>
    <!-- utility classes with the characters CSS has to escape, an id that starts with a digit; twins that differ in one class -->
    <div class="flex items-center gap-2 p-4">
      <div class="h-6 w-1/2 md:p-6"></div>
      <div class="h-6 w-1/2 2xl:px-8"></div>
      <div class="h-6 w-1/2 -mt-1"></div>
      <div class="h-6 w-1/2 bg-[#f0f0f0]"></div>
      <div class="h-6 w-1/2 [&>*]:mx-0"></div>
      <div class="h-6 w-1/2 hover:underline !font-bold"></div>
    </div>
    <div class="flex p-4">
      <span class="h-6"></span>
      <span class="h-6"></span>
    </div>
    <p id="1-col"></p>
  </body>
</html>
