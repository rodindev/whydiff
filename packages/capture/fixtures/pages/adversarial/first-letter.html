<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>::first-letter</title>
    <style>
      body { margin: 0; background: #fff; }
      p { position: absolute; left: 100px; margin: 0; width: 300px; font: 20px/40px monospace; }
      p::first-letter { float: left; font-size: 0; line-height: 0; padding: 20px; background: #ff0000; }
    </style>
  </head>
  <body>
    <!-- a floated 40px drop cap: the line starts after it at 140 -->
    <p style="top: 100px">W<span id="fl-after" style="display: inline-block; vertical-align: top; width: 40px; height: 40px; background: #00ff00" data-color="00ff00" data-expect="140,100,40,40"></span></p>
    <p id="fl-text" style="top: 200px" data-expect-text="Hello world">Hello world</p>
  </body>
</html>
