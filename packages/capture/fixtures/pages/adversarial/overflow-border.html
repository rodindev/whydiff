<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Overflow clips at the padding box</title>
    <style>
      body { margin: 0; background: #fff; }
      .m { position: absolute; width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <!-- overflow clips to the padding box: 140..340 inside a 40px border, so a child inside the border band is not painted -->
    <div style="position: absolute; left: 100px; top: 100px; width: 200px; height: 200px; border: 40px solid #cccccc; overflow: hidden">
      <div id="in-padding" class="m" style="left: 10px; top: 10px; background: #ff0000" data-color="ff0000" data-expect="150,150,40,40"></div>
      <div id="in-border" class="m" style="left: -40px; top: 0; background: #00ff00" data-color="00ff00" data-expect-flag="clipped"></div>
    </div>
    <!-- overflow with border-radius clips to the rounded padding box: the corner square 0..40 lies outside a 200px radius circle -->
    <div style="position: absolute; left: 500px; top: 100px; width: 400px; height: 400px; border-radius: 200px; overflow: hidden; background: #eeeeee">
      <div id="in-corner" class="m" style="left: 0; top: 0; background: #0000ff" data-color="0000ff" data-expect-flag="clipped"></div>
      <div id="in-circle" class="m" style="left: 180px; top: 180px; background: #ff00ff" data-color="ff00ff" data-expect="680,280,40,40"></div>
    </div>
  </body>
</html>
