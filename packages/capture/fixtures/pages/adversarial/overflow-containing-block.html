<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Overflow that does not contain its descendants</title>
    <style>
      body { margin: 0; background: #fff; }
      .clip { width: 100px; height: 100px; overflow: hidden; background: #dddddd; }
      .m { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <!-- an absolute child's containing block is the positioned #cb, not the static overflow:hidden box between them -->
    <div id="cb" style="position: relative; margin: 100px 0 0 100px; width: 600px; height: 400px; background: #eeeeee">
      <div class="clip">
        <div id="esc-abs" class="m" style="position: absolute; left: 300px; top: 200px; background: #ff0000" data-color="ff0000" data-expect="400,300,40,40"></div>
      </div>
      <!-- a fixed child escapes every overflow box that is not transformed -->
      <div class="clip" style="position: relative; margin-top: 20px">
        <div id="esc-fixed" class="m" style="position: fixed; left: 800px; top: 100px; background: #00ff00" data-color="00ff00" data-expect="800,100,40,40"></div>
      </div>
      <!-- control: a positioned overflow:hidden box does clip its absolute child -->
      <div class="clip" style="position: absolute; left: 300px; top: 0">
        <div id="kept-abs" class="m" style="position: absolute; left: 150px; top: 0; background: #0000ff" data-color="0000ff" data-expect-flag="clipped"></div>
      </div>
    </div>
  </body>
</html>
