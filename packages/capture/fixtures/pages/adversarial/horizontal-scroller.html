<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Viewport-sized page with a horizontal scroller</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      header { height: 60px; background: #eeeeee; }
      #carousel { display: flex; gap: 20px; height: 200px; overflow-x: auto; scroll-snap-type: x mandatory; }
      .card { position: relative; flex: none; width: 200px; scroll-snap-align: start; background: #dddddd; }
      .m { position: absolute; left: 10px; top: 10px; width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <!-- eight 200px cards with 20px gaps start at k * 220; scrollLeft 430 snaps to the card start 440 -->
    <header></header>
    <div id="carousel" data-expect-scroll="440,0,1740,200">
      <div class="card"><div id="card-0" class="m" style="background: #ff0000" data-color="ff0000" data-expect-flag="clipped"></div></div>
      <div class="card"></div>
      <div class="card"><div id="card-2" class="m" style="background: #00ff00" data-color="00ff00" data-expect="10,70,40,40"></div></div>
      <div class="card"></div>
      <div class="card"><div id="card-4" class="m" style="background: #0000ff" data-color="0000ff" data-expect="450,70,40,40"></div></div>
      <div class="card"></div>
      <div class="card"><div id="card-6" class="m" style="background: #ff00ff" data-color="ff00ff" data-expect="890,70,40,40"></div></div>
      <div class="card"></div>
    </div>
    <script>
      document.getElementById('carousel').scrollLeft = 430
    </script>
  </body>
</html>
