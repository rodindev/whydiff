name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.18.0
          - os: ubuntu-24.04
            node: 24
          - os: ubuntu-24.04
            node: 26
          - os: macos-26
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Install Chromium headless shell
        run: pnpm browsers --with-deps

      - name: Install WebKit
        if: runner.os == 'Linux'
        run: pnpm --filter @whydiff/playwright exec playwright install --with-deps webkit

      - name: Lint, format, typecheck, build, test
        run: pnpm check

      - name: Pack smoke
        run: pnpm pack:smoke

      - name: Working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload fixture project output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-project-output-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            packages/playwright/fixtures/project/test-results/
            packages/playwright/fixtures/project/whydiff-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    name: Playwright ${{ matrix.playwright }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.53.2', '1.59.1', '1.61.1', latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - run: pnpm build

      - name: Install the release's Chromium headless shell
        env:
          PLAYWRIGHT: ${{ matrix.playwright }}
        # From outside the workspace: inside, npx takes the locked copy of the same version, with no bin.
        run: cd "$RUNNER_TEMP" && npx --yes "playwright-core@$PLAYWRIGHT" install --with-deps chromium-headless-shell

      - name: Run the fixture project against the release
        env:
          PLAYWRIGHT: ${{ matrix.playwright }}
        run: pnpm --filter @whydiff/playwright matrix "$PLAYWRIGHT"

  workflows:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  ci-ok:
    name: CI OK
    if: always()
    needs: [check, playwright, workflows]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
